name: Rebecca Android
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebecca-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL: prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Prepare upstream core and generated sources
        run: make android-prepare
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test Rebecca configuration parsing
        run: flutter test test/features/profile/profile_nodes_test.dart test/features/profile/rebecca_theme_test.dart
      - name: Build Android APK
        run: flutter build apk --release --target lib/main_prod.dart --build-name 0.0.1 --build-number 1
      - uses: actions/upload-artifact@v4
        with:
          name: Rebecca-0.0.1-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
